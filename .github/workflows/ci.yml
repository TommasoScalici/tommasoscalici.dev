name: CI/CD & Release
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    check:
        name: Check & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Check Formatting
              run: npm run format:check

            - name: Generate Content Types
              run: npx astro sync

            - name: Type Check (Astro)
              run: npm run check

            - name: Run Tests
              run: npm test

            - name: Build
              env:
                  PUBLIC_TIKTOK_PIXEL_ID: ${{ secrets.PUBLIC_TIKTOK_PIXEL_ID }}
                  PUBLIC_FACEBOOK_PIXEL_ID: ${{ secrets.PUBLIC_FACEBOOK_PIXEL_ID }}
              run: npm run build

    release:
        name: Semantic Release
        needs: check
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write # to be able to publish a GitHub release
            issues: write # to be able to comment on released issues
            pull-requests: write # to be able to comment on released pull requests
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0 # Required for semantic-release to analyze commits
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release

    deploy:
        name: Deploy to Cloudflare Pages
        needs: release
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              env:
                  PUBLIC_TIKTOK_PIXEL_ID: ${{ secrets.PUBLIC_TIKTOK_PIXEL_ID }}
                  PUBLIC_FACEBOOK_PIXEL_ID: ${{ secrets.PUBLIC_FACEBOOK_PIXEL_ID }}
              run: npm run build

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy dist --project-name=tommasoscalici-dev
